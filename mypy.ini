[mypy]
python_version = 3.11
# The canonical, torch-free surface is fully type-checked.  era/models.py is
# excluded: it imports torch/transformers, whose stubs are not installed in
# CI; its behaviour is covered by the integration tests instead.
files = era/metrics.py, era/pipeline.py, era/report.py, era/contexts.py
ignore_missing_imports = True
warn_return_any = True
warn_unused_configs = True
