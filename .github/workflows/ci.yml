name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # No torch here, deliberately: the unit suite must pass in a
        # torch-free environment (that property is part of the design).
        run: |
          python -m pip install --upgrade pip
          pip install -e .[experiments,dev]
          pip check

      - name: Check command-line entry point
        run: python experiments/run_screening.py --help

      - name: Lint (flake8)
        run: flake8 tests era experiments

      - name: Type check (mypy)
        run: mypy --config-file mypy.ini

      - name: Run unit tests
        # models.py is covered by the integration job below, so 70% total
        # coverage is the floor for the torch-free surface.
        run: pytest --cov-fail-under=70

      - name: Verify public result summary
        run: python experiments/23_build_public_summary.py --check

  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .[experiments,dev]
          pip check

      - name: Run integration tests (real models)
        # Downloads Pythia-160m/70m and the GPT-Neo config from the HF hub.
        # Includes the canonical negative control (model vs itself) and the
        # structural-mismatch refusals.
        run: ERA_RUN_INTEGRATION=1 pytest tests/test_models_integration.py -v --no-cov
