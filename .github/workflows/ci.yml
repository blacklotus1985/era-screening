name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # The offline suite includes a tiny training regression test.
        # Install CPU torch explicitly to avoid pulling CUDA wheels in CI.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .[experiments,dev]
          pip check

      - name: Check command-line entry point
        run: python experiments/run_screening.py --help

      - name: Lint (flake8)
        run: flake8 tests era experiments

      - name: Type check (mypy)
        run: mypy --config-file mypy.ini

      - name: Run unit tests
        # Network downloads remain in the separate integration job.
        run: pytest --cov-fail-under=70

      - name: Verify public result summary
        run: python experiments/23_build_public_summary.py --check

      - name: Verify the published presentation
        run: python docs/deck_source/post.py

  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .[experiments,dev]
          pip check

      - name: Run integration tests (real models)
        # Downloads Pythia-160m/70m and the GPT-Neo config from the HF hub.
        # Includes the canonical negative control (model vs itself) and the
        # structural-mismatch refusals.
        run: ERA_RUN_INTEGRATION=1 pytest tests/test_models_integration.py -v --no-cov
